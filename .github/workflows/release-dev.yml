name: Create Dev Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.5 or 1.0.5b2 (adds -dev; uses v1.0.5 changelog)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_BRANCH: develop

jobs:
  create-dev-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_BRANCH }}

      - name: Verify branch exists and is checked out
        id: source
        run: |
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$CURRENT_BRANCH" != "${RELEASE_BRANCH}" ]; then
            echo "Expected branch '${RELEASE_BRANCH}', got '${CURRENT_BRANCH}'"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare dev version and base changelog notes
        id: changelog
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node scripts/dev-release.mjs prepare "$INPUT_VERSION" "$RUNNER_TEMP/release_notes.md"

      - name: Check if tag already exists
        run: |
          git fetch --tags
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${{ env.VERSION }} already exists."
            exit 1
          fi

      - name: Run tests and lint before release
        run: |
          npm test
          npm run lint

      - name: Build dist for dev release
        run: |
          rm -f dist/unifi-device-card.js
          npm run build
          node scripts/dev-release.mjs describe "$NOTES_FILE"
        env:
          VERSION: ${{ env.VERSION }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}

      - name: Commit dist if changed
        id: bundle_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/unifi-device-card.js
          git diff --cached --quiet || git commit -m "release: prepare ${{ env.VERSION }} [skip ci]"
          git push origin "${RELEASE_BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Git tag on develop
        run: |
          git tag -a "${{ env.VERSION }}" "${{ steps.bundle_commit.outputs.sha }}" -m "${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ steps.bundle_commit.outputs.sha }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          prerelease: true
          files: dist/unifi-device-card.js
          fail_on_unmatched_files: true
