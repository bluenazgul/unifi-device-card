name: Create Release
# Manual trigger from the GitHub Actions UI.
# Builds the bundle with the given version baked in, commits the
# updated dist file, tags the commit, and creates a GitHub release
# with the compiled JS as the only release asset (required by HACS).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        required: true
        type: string
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_BRANCH }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Validate and normalize version format
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Accept with or without leading "v" (e.g. "1.0.0" or "v1.0.0")
          RAW="$INPUT_VERSION"
          VERSION="${RAW#v}"           # strip leading v if present
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3 or v1.2.3 (got: $RAW)"
            exit 1
          fi
          # Always store with v-prefix for consistent git tags
          echo "VERSION=v${VERSION}" >> $GITHUB_ENV
      - name: Check if tag already exists
        run: |
          git fetch --tags
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${{ env.VERSION }} already exists."
            exit 1
          fi
      - name: Extract changelog for this version
        id: changelog
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          node scripts/release-notes.mjs "$VERSION" "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ env.VERSION }}
      - name: Run tests and lint before release
        run: |
          npm test
          npm run lint
      - name: Build dist for release
        run: npm run build
        env:
          GITHUB_EVENT_NAME: release
          GITHUB_REF_NAME: ${{ env.VERSION }}
      - name: Commit dist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only commit the compiled bundle – lock file changes belong in
          # regular dependency-update commits, not in release commits.
          git add dist/unifi-device-card.js
          git diff --cached --quiet || git commit -m "release: prepare ${{ env.VERSION }} [skip ci]"
          git push origin "${RELEASE_BRANCH}"
      - name: Create Git tag
        run: |
          git tag -a "${{ env.VERSION }}" -m "${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          # HACS downloads this asset when users install / update the plugin.
          # HACS expects the compiled JS bundle as the release asset.
          files: dist/unifi-device-card.js
